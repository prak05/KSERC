# Local stack: the app plus an Ollama model server. Nothing leaves your machine.
#   docker compose up --build        → http://localhost:8080
#   first run: docker compose exec ollama ollama pull qwen2.5:14b
services:
  app:
    build: .
    ports: ["8080:8080"]
    environment:
      CLOUD: local
      LLM_PROVIDER: local
      LOCAL_LLM_URL: http://ollama:11434/v1
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-qwen2.5:14b}
      LOCAL_DB_PATH: /app/state/store.sqlite3
    volumes:
      - state:/app/state
      - uploads:/app/uploads
    depends_on: [ollama]

  ollama:
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]

volumes:
  state:
  uploads:
  ollama:
